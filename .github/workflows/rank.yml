# Where PREJUDGE stands in the App Store search, once a day.
#
# It used to be scheduled for 06:40 Amsterdam, with two cron lines for summer and winter time and a guard so that
# only the one that was 06:xx in Amsterdam did the work. GitHub does not start a scheduled job when the cron says;
# it starts it when it has a runner to spare. Through October 2026 that was five to seven and a half hours late,
# every day, so the guard was never true and the rank went unread from 12 October.
#
# So: nothing depends on the clock any more. Several attempts through the day, and the first one that gets through
# does the work. The others cost a few seconds, because the script asks the dashboard whether the day is already
# written down before it asks Apple anything. A day only half read is finished off by the next attempt.

name: App Store rank

on:
  schedule:
    - cron: '40 4 * * *'    # 06:40 Amsterdam in summer, 05:40 in winter
    - cron: '40 8 * * *'
    - cron: '40 12 * * *'
    - cron: '40 16 * * *'
  workflow_dispatch:

# Two attempts at once would both read Apple and both post. One at a time, and a late one is never cancelled: it
# may be the only one that gets through today.
concurrency:
  group: app-store-rank
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    # Sixty-four questions at four seconds apart, plus Apple taking its time: about eight minutes when nothing
    # goes wrong, and a retry on a 429 waits longer still.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check the script still does what it says
        run: npm test
      - name: Ask Apple and post the readings
        env:
          RANKINGS_URL: ${{ secrets.RANKINGS_URL }}
          RANKINGS_TOKEN: ${{ secrets.RANKINGS_TOKEN }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID || '6814166907' }}
          # By hand means read it now, whatever the day already holds.
          RANKINGS_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: node rank.mjs
